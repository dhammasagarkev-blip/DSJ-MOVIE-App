<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSJ MOVIE TOOL 🎬</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .app-card { background: #1a1a1a; border: 2px solid #ff0000; border-radius: 20px; padding: 30px; max-width: 500px; margin: 20px auto; }
        h1 { color: #ff0000; margin-bottom: 5px; }
        .section-title { border-bottom: 1px solid #333; padding: 10px; margin: 20px 0; color: #ffcc00; font-weight: bold; }
        input, textarea { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        .btn { background: #ff0000; color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .result-box { background: #000; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; display: none; border-left: 4px solid #ffcc00; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>DSJ MOVIE TOOL 🎬</h1>
    <p style="color:#ccc">YouTube Automation Hub</p>

    <div class="section-title">Step 1: Video Optimizer</div>
    <input type="file" id="movieFile" accept="video/*">
    <button class="btn" onclick="startProcessing()">START EDITING</button>
    <p id="status" style="color:#00ff00; margin-top:10px;"></p>

    <div class="section-title">Step 2: AI YouTube Helper</div>
    <input type="text" id="topicInput" placeholder="Enter Topic (e.g. Movie Name)">
    <button class="btn" style="background:#ffcc00; color:black" onclick="generateAI()">GENERATE VIRAL INFO</button>

    <div id="aiResult" class="result-box">
        <strong style="color:#ffcc00">Recommended Titles:</strong>
        <p id="resTitle"></p>
        <hr style="border:0.5px solid #333">
        <strong style="color:#ffcc00">Viral Description:</strong>
        <p id="resDesc" style="white-space: pre-line; font-size:13px"></p>
    </div>
</div>

<script>
    function startProcessing() {
        if(!document.getElementById('movieFile').value) { alert("File select karein!"); return; }
        let s = document.getElementById('status');
        s.innerText = "Processing Started...";
        setTimeout(() => { s.innerText = "Applying Mirror & 1.1x Zoom..."; }, 2000);
        setTimeout(() => { s.innerText = "Success! Copyright-Free Ready."; alert("Done!"); }, 4000);
    }

    function generateAI() {
        let t = document.getElementById('topicInput').value;
        if(!t) { alert("Topic dalo!"); return; }
        document.getElementById('aiResult').style.display = "block";
        document.getElementById('resTitle').innerHTML = "1. " + t + " | Best Review \n<br>2. Why " + t + " is VIRAL?";
        document.getElementById('resDesc').innerText = "Namaste! Aaj hum baat karenge " + t + " ke baare mein.\n\nDisclaimer: Under Section 107 of Copyright Act...";
    }
</script>

</body>
</html>
